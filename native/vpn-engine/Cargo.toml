[package]
name = "vpn-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Android Kerio Control VPN engine using opencontrol-protocol"

[lib]
crate-type = ["cdylib", "rlib"]
name = "vpn_engine"

[dependencies]
opencontrol-protocol = { git = "https://github.com/nr084/opencontrol-protocol.git", tag = "v0.9.0", version = "=0.9.0" }
bytes = "1"
thiserror = "2"
zeroize = "1"
getrandom = "0.2"
jni = "0.21"
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
sha2 = "0.10"
hex = "0.4"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
